<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Share A Secret</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="container">
        <h1>Register</h1>
        <p>Verified users can upload files.</p>

        {{if .Error}}
        <p class="error">{{.Error}}</p>
        {{end}}

        {{if .Success}}
        <p style="color: green; font-weight: bold;">{{.Success}}</p>
        <div style="margin-top: 1rem;">
            <a href="/login"><button type="button">Go to Login</button></a>
            <a href="/"><button type="button" style="background-color: #6c757d; margin-top: 10px;">Back
                    Home</button></a>
        </div>
        {{else}}
        <form method="POST" action="/register">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="your@email.com"
                style="width: 100%; padding: 0.5rem; margin-bottom: 1rem; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;" />

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required placeholder="Min 6 characters" minlength="6" autocomplete="off"
                style="width: 100%; padding: 0.5rem; margin-bottom: 1rem; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;" />

            <button type="submit">Register</button>
        </form>
        <div style="margin-top: 1rem; text-align: center;">
            <p>Already have an account? <a href="/login">Login</a></p>
            <a href="/">Back to Home</a>
        </div>
        {{end}}
    </div>
</body>

</html>
