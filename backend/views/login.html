<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Share A Secret</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="container">
        <h1>Login</h1>
        <p>Login to upload file secrets.</p>

        {{if .Error}}
        <p class="error">{{.Error}}</p>
        {{end}}

        <form method="POST" action="/login">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="your@email.com"
                style="width: 100%; padding: 0.5rem; margin-bottom: 1rem; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;" />

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required placeholder="Your password" autocomplete="off"
                style="width: 100%; padding: 0.5rem; margin-bottom: 1rem; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;" />

            <button type="submit">Login</button>
        </form>

        <div style="margin-top: 1rem; text-align: center;">
            <p>Don't have an account? <a href="/register">Register</a></p>
            <a href="/">Back to Home</a>
        </div>
    </div>
</body>

</html>
